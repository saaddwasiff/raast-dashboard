<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Raast Growth Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" data-keep>
<style id="app-style" data-keep>
/* Layout: sticky header with tabs over a single 1240px column of cards; KPI strip leads the overview. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#f8faf9; --ink:#0e1a17; --ink-2:#47544f; --muted:#76837e; --line:#dde4e1; --grid:#e8edeb;
  --accent:#0b6e4f; --accent-ink:#ffffff; --accent-soft:#e2f0ea;
  --s-p2p:#2a78d6; --s-p2m:#eb6834; --s-bulk:#1baf7a; --s-other:#c5ccc9; --s-dig:#76837e;
  --good:#006300; --warn:#8a5b00; --warn-bg:#fdf3dc; --crit:#b42f2f; --crit-bg:#fbe7e7; --info-bg:#e7f0fb;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1211; --surface:#151b19; --surface-2:#1a2220; --ink:#ecf1ef; --ink-2:#b6c1bc; --muted:#87938e; --line:#27302d; --grid:#212a27;
  --accent:#3dbd8d; --accent-ink:#06130e; --accent-soft:#163029;
  --s-p2p:#3987e5; --s-p2m:#d95926; --s-bulk:#199e70; --s-other:#3a4542; --s-dig:#87938e;
  --good:#3cc23c; --warn:#e7b04a; --warn-bg:#2e2412; --crit:#ef7d7d; --crit-bg:#331a1a; --info-bg:#16233a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1211; --surface:#151b19; --surface-2:#1a2220; --ink:#ecf1ef; --ink-2:#b6c1bc; --muted:#87938e; --line:#27302d; --grid:#212a27;
  --accent:#3dbd8d; --accent-ink:#06130e; --accent-soft:#163029;
  --s-p2p:#3987e5; --s-p2m:#d95926; --s-bulk:#199e70; --s-other:#3a4542; --s-dig:#87938e;
  --good:#3cc23c; --warn:#e7b04a; --warn-bg:#2e2412; --crit:#ef7d7d; --crit-bg:#331a1a; --info-bg:#16233a;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;color:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 8px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:12.5px}
.asof{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.tabs{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px 9px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.preview-bar{background:var(--warn-bg);color:var(--warn);text-align:center;padding:8px 16px;font-size:13px;font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}

.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 8px}
.panel{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:980px){.g-2,.g-3,.g-2-1{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.card-h h2{font-size:15.5px;font-weight:600}
.note{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.chart{position:relative;width:100%}
.h220{height:220px}.h240{height:240px}.h260{height:260px}.h280{height:280px}.h300{height:300px}.h320{height:320px}.h340{height:340px}.h360{height:360px}.h380{height:380px}
@media (max-width:600px){.h340,.h360,.h380{height:300px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.sw.line{height:0;border-top:2.5px solid;border-radius:0;width:18px}
.sw.dash{height:0;border-top:2.5px dashed;border-radius:0;width:18px}
.sw.dot{height:0;border-top:2.5px dotted;border-radius:0;width:18px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.sel{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.sel select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.lead .k-l,.kpi.lead .k-s{color:inherit;opacity:.85}
.kpi.lead .k-v{color:inherit}
.k-l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.k-v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.k-v small{font-size:14px;font-weight:600;margin-left:3px}
.k-s{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px}
.delta{font-weight:600;white-space:nowrap}
.delta.up{color:var(--good)}.delta.down{color:var(--crit)}
.kpi.lead .delta{color:inherit}

.readings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.readings li{padding-left:14px;border-left:2px solid var(--line);color:var(--ink-2);font-size:13.5px}
.readings li b{color:var(--ink);font-weight:600}

.tablewrap{overflow-x:auto;margin:0 -4px}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .der{font-style:italic;color:var(--muted)}
.tbl .grp{color:var(--muted);font-weight:500}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.est{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.flag{color:var(--warn);font-weight:600}

.controls{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl-l{font-size:12px;color:var(--muted);font-weight:600}
.ctl-l b{color:var(--ink);font-family:var(--f-mono);font-weight:600;margin-left:4px}
input[type=range]{width:200px;max-width:100%;accent-color:var(--accent)}
.ends{display:flex;flex-direction:column;gap:12px}
.end{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline}
.end .sw{grid-row:span 2;align-self:center}
.end-l{font-size:12.5px;color:var(--ink-2)}
.end-v{font-family:var(--f-display);font-size:20px;font-weight:700}
.end-s{grid-column:2;font-size:12px;color:var(--muted)}
.method .cols,.src.cols{columns:2 300px;column-gap:28px}
.method p,.src p{margin:0 0 10px;break-inside:avoid;color:var(--ink-2);font-size:13.5px}
.method h2{font-size:15.5px;margin-bottom:10px}
.method b,.src b{color:var(--ink)}

.steps{margin:0 0 14px;padding-left:20px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.upl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){.upl{grid-template-columns:minmax(0,1fr)}}
.file{border:1.5px dashed var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.file:hover,.file:focus-within{border-color:var(--accent)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file-t{font-weight:600;font-size:13px}
.file-n{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.upres{margin-top:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.sumgrid{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:4px 14px;font-variant-numeric:tabular-nums}
.sumgrid .h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{border-radius:8px;padding:8px 10px 8px 34px;font-size:13px;position:relative;background:var(--surface-2);color:var(--ink-2)}
.checks li::before{position:absolute;left:10px;top:8px;font-weight:700;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:11px;line-height:1}
.checks li.warn{background:var(--warn-bg)}.checks li.warn::before{content:"!";background:var(--warn);color:var(--surface)}
.checks li.error{background:var(--crit-bg)}.checks li.error::before{content:"×";background:var(--crit);color:var(--surface)}
.checks li.info{background:var(--info-bg)}.checks li.info::before{content:"i";background:var(--s-p2p);color:#fff}
.checks li.ok::before{content:"✓";background:var(--good);color:var(--surface)}
.foot{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:8px 28px;color:var(--muted);font-size:12px}
.rowsw{margin-right:8px;vertical-align:-1px;border-radius:3px}
.rowsw.none{background:transparent;border:1px solid var(--line)}
.tbl td.yoy{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:200px}
.ybar{flex:1;max-width:140px;height:8px;background:var(--grid);border-radius:4px;overflow:hidden;display:block}
.ybar i{display:block;height:100%;border-radius:4px}
.ybar i.neg{background:var(--crit)}.ybar i.t1{background:var(--muted)}.ybar i.t2{background:color-mix(in srgb,var(--accent) 55%,var(--surface))}.ybar i.t3{background:var(--accent)}.ybar i.t4{background:var(--good)}
.ypill{display:inline-block;min-width:58px;text-align:center;padding:2px 8px;border-radius:999px;font-weight:600;font-size:12px}
.ypill.neg{background:var(--crit-bg);color:var(--crit)}.ypill.t1{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.ypill.t2{background:var(--accent-soft);color:var(--ink)}.ypill.t3{background:var(--accent);color:var(--accent-ink)}.ypill.t4{background:var(--good);color:var(--surface)}
.eco-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
/* monthly detail: bold headers and month column, crosshair highlight */
.tbl.xhair thead th{color:var(--ink);font-weight:700}
.tbl.xhair tbody td:first-child{font-weight:700;color:var(--ink)}
.tbl.xhair tbody tr:hover{background:transparent}
.tbl.xhair td,.tbl.xhair th{transition:background-color .08s}
.tbl.xhair .xh-row td,.tbl.xhair .xh-col{background:var(--accent-soft)}
.tbl.xhair thead th.xh-col{background:var(--accent-soft);color:var(--ink)}
.tbl.xhair td.xh-cell{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:4px}
.tbl.xhair td.xh-cell.der{color:var(--accent-ink)}
.tbl.xhair tbody td{cursor:default}
/* entrance and export controls */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel.enter .card,.panel.enter .kpi,.panel.enter .toolbar{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
.panel.enter .kpi .k-s{animation:fadein .5s ease both;animation-delay:calc(var(--i,0) * 70ms + 950ms)}
.k-v{font-variant-numeric:tabular-nums}
.readings li{font-size:15px;line-height:1.55}
.toolbar{align-items:center}
.pdf-btn{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px}
.one-btn{padding:5px 12px;font-size:12.5px}
.xp{position:relative;margin-left:auto;align-self:flex-start}
.card-h .seg+.xp{margin-left:8px}
.xp-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
.xp-btn:hover{color:var(--ink);border-color:var(--accent)}
.xp-btn:disabled{opacity:.6;cursor:progress}
.xp-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:250px;display:flex;flex-direction:column}
.xp-menu[hidden]{display:none!important}
.xp-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.xp-menu button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.xp-menu button:hover,.xp-menu button:focus-visible{background:var(--accent-soft)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
#toast.bad{background:var(--crit)}
@media (max-width:600px){.xp-btn span,.pdf-btn span{display:none}.xp-menu{min-width:220px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="app" data-keep></div>
<script type="text/plain" id="shell-src" data-keep>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 17 L9 11 L13 15 L21 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7 H21 V13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div>
        <h1>Raast Growth Dashboard</h1>
        <p class="sub">Karandaaz Pakistan · Raast Ecosystem Development</p>
      </div>
    </div>
    <div class="asof" id="asof"></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Dashboard sections">
    <button role="tab" id="tab-overview" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" id="tab-monthly" data-tab="monthly" aria-selected="false">Monthly</button>
    <button role="tab" id="tab-quarterly" data-tab="quarterly" aria-selected="false">Quarterly (PSR)</button>
    <button role="tab" id="tab-ecosystem" data-tab="ecosystem" aria-selected="false">Ecosystem</button>
    <button role="tab" id="tab-outlook" data-tab="outlook" aria-selected="false">Growth &amp; 5-yr outlook</button>
    <button role="tab" id="tab-data" data-tab="data" aria-selected="false">Data &amp; update</button>
  </nav>
</header>
<div class="preview-bar" id="previewBar" hidden>Previewing unpublished data on this screen only. <button class="linkbtn" id="previewExit" type="button">Return to published data</button></div>

<main class="wrap">

<section class="panel" id="p-overview" data-panel="overview">
  <div class="kpis" id="kpis"></div>
  <div class="grid g-2-1">
    <article class="card">
      <div class="card-h"><div><h2>Raast transactions by fiscal year</h2><p class="note" id="ovAnnualNote"></p></div>
        <div class="seg" role="group" aria-label="Measure"><button type="button" class="on" data-ov-metric="v">Volume</button><button type="button" data-ov-metric="val">Value</button></div></div>
      <div class="chart h320"><canvas id="cOvAnnual" aria-label="Raast annual transactions with base-case projection"></canvas></div>
      <div class="legend" id="lgOvAnnual"></div>
    </article>
    <article class="card">
      <div class="card-h"><div><h2>Key readings</h2><p class="note">Generated from the loaded data</p></div></div>
      <ul class="readings" id="readings"></ul>
    </article>
  </div>
  <div class="grid g-2">
    <article class="card">
      <div class="card-h"><div><h2>Raast share of digital payments</h2><p class="note">Quarterly, 10-channel PSR denominator, from Q1 FY24</p></div></div>
      <div class="chart h260"><canvas id="cOvShare"></canvas></div>
      <div class="legend" id="lgOvShare"></div>
    </article>
    <article class="card">
      <div class="card-h"><div><h2>Last 12 months</h2><p class="note">All use cases, SBP monthly reporting (provisional)</p></div></div>
      <div class="chart h260"><canvas id="cOvMonthly"></canvas></div>
      <div class="legend" id="lgOvMonthly"></div>
    </article>
  </div>
</section>

<section class="panel" id="p-monthly" data-panel="monthly" hidden>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Measure"><button type="button" class="on" data-m-metric="v">Volume</button><button type="button" data-m-metric="val">Value</button></div>
    <div class="seg" role="group" aria-label="Range"><button type="button" class="on" data-m-range="12">Last 12 months</button><button type="button" data-m-range="all">All months</button></div>
  </div>
  <article class="card">
    <div class="card-h"><div><h2 id="mVolTitle">Monthly Raast transactions by use case</h2><p class="note" id="mVolNote"></p></div></div>
    <div class="chart h340"><canvas id="cMVol"></canvas></div>
    <div class="legend" id="lgMVol"></div>
  </article>
  <div class="grid g-3">
    <article class="card"><div class="card-h"><div><h2>P2M transactions</h2><p class="note">Million per month</p></div></div><div class="chart h220"><canvas id="cMP2M"></canvas></div></article>

    </article>
  </div>
  <article class="card method">
    <h2>How the projection works</h2>
    <div class="cols">
      <p><b>Starting point.</b> <span id="mStart"></span></p>
      <p><b>Base case.</b> Growth falls in a straight line from the selected CAGR to the long-run rate by year five. The digital-payments total is projected the same way from its own CAGR.</p><p><b>Share ceiling.</b> The highest share of digital payments Raast is allowed to reach. If a projected year would push Raast above it, that year is held at the ceiling. It stops the projection implying that Raast replaces cards, wallets and other channels entirely.</p>
      <p><b>Conservative.</b> The gap between the CAGR and the long-run rate halves every year, so growth slows faster in the early years. The same ceiling applies.</p>
    </div>
  </article>
</section>

        <li>When SBP publishes a new Payment Systems Review, load the PDF as it is. The dashboard reads its annexure tables (Raast, retail payments by channel, ATM cash withdrawals, infrastructure and users) and adds the new quarter, applying SBP's revisions to earlier quarters.</li>
        <li>Upload both files to the <b>data/inbox</b> folder of the GitHub repository. The website reads them and updates itself within a few minutes. To check files first without changing anything, load them below and click Check files.</li>

      </div>
      <div class="btnrow">

    <div class="cols src" id="sources"></div>

</section>

/* Row + column highlight on hover (or tap) for dense tables */
function crosshair(tbl){
  if(tbl._xh) return; tbl._xh=true;
  var lastCol=-1;
  function clear(){ tbl.querySelectorAll('.xh-row,.xh-col,.xh-cell').forEach(function(el){el.classList.remove('xh-row','xh-col','xh-cell');}); lastCol=-1; }
  function mark(td){
    var tr=td.parentElement, col=td.cellIndex; clear();
    if(tr.parentElement.tagName==='TBODY') tr.classList.add('xh-row');
    if(col>0){ Array.prototype.forEach.call(tbl.rows,function(r){ var c=r.cells[col]; if(c) c.classList.add('xh-col'); }); }
    if(tr.parentElement.tagName==='TBODY'&&col>0) td.classList.add('xh-cell');
    lastCol=col;
  }
  tbl.addEventListener('mouseover',function(e){ var td=e.target.closest('td,th'); if(td&&tbl.contains(td)) mark(td); });
  tbl.addEventListener('mouseleave',clear);
  tbl.addEventListener('click',function(e){ var td=e.target.closest('td,th'); if(td) mark(td); });
}

function buildDocument(data){

  if(!window.claude)return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>'+reset+'</style></head><body>'+parts.join('\n')+'</body></html>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+parts.join('\n')+'</body></html>';

    if(c==='conflict'){out.insertAdjacentHTML('afterbegin','<div class="flag">A newer version was published a moment ago. The page is reloading to it; load your files again afterwards.</div>');}
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'){canPublish=false;btn.hidden=true;$('upRole').textContent='You can view and preview data. Only editors of this dashboard can publish.';}

    btn.addEventListener('click',function(e){e.stopPropagation();var open=menu.hidden;closeMenus();menu.hidden=!open;btn.setAttribute('aria-expanded',String(open));});
    menu.addEventListener('click',function(e){var b=e.target.closest('[data-fmt]');if(!b)return;closeMenus();busy(btn,true,'Preparing…');
      exportChart(cv.id,b.dataset.fmt).then(function(){toast('Downloaded.');}).catch(function(err){toast('Download failed: '+(err&&err.message||err)+'. Check your connection and try again.',true);}).then(function(){busy(btn,false);});});
  });
  document.addEventListener('click',closeMenus);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenus();});
  ['overview','monthly','quarterly','ecosystem','outlook'].forEach(function(p){
    var el=document.querySelector('[data-panel="'+p+'"]');if(!el)return;var bar=el.querySelector('.toolbar');
    if(!bar){bar=document.createElement('div');bar.className='toolbar panel-actions';el.insertBefore(bar,el.firstChild);}
    var b=document.createElement('button');b.type='button';b.className='btn ghost pdf-btn';b.innerHTML=DL_ICON+'<span>Section PDF</span>';b.title='Download a PDF report of this section';
    b.addEventListener('click',function(){busy(b,true,'Building PDF…');sectionPDF(p).then(function(){toast('PDF downloaded.');}).catch(function(err){toast('PDF failed: '+(err&&err.message||err),true);}).then(function(){busy(b,false);});});
    bar.appendChild(b);});
  var one=document.createElement('button');one.type='button';one.className='btn primary one-btn';one.id='btnOnePager';one.innerHTML=DL_ICON+'<span>One-page summary</span>';one.title='Download a one-page PDF summary of all sections';
  one.addEventListener('click',function(){busy(one,true,'Building PDF…');onePagerPDF().then(function(){toast('Summary downloaded.');}).catch(function(err){toast('PDF failed: '+(err&&err.message||err),true);}).then(function(){busy(one,false);});});
  $('asof').insertAdjacentElement('afterend',one);
}
function closeMenus(){document.querySelectorAll('.xp-menu').forEach(function(m){m.hidden=true;});document.querySelectorAll('.xp-btn').forEach(function(b){b.setAttribute('aria-expanded','false');});}

/* ---------- tabs & controls ---------- */
var RENDER={overview:renderOverview,monthly:renderMonthly,quarterly:renderQuarterly,ecosystem:renderEcosystem,outlook:renderOutlook,data:renderData};
function show(tab){current=tab;document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===tab));});
  document.querySelectorAll('.panel').forEach(function(p){p.hidden=p.dataset.panel!==tab;});
  var panel=document.querySelector('[data-panel="'+tab+'"]');
  if(panel&&!REDUCED){panel.querySelectorAll('.card,.toolbar,.panel-actions').forEach(function(el,i){el.style.setProperty('--i',Math.min(i,10));});panel.classList.remove('enter');void panel.offsetWidth;panel.classList.add('enter');}
  ANIM_T=0;RENDER[tab]();built[tab]=true;
  try{localStorage.setItem('raast-tab',tab);}catch(e){}
}
function refresh(){X=derive(D);renderHeader();built={};$('qSel').innerHTML='';RENDER[current]();built[current]=true;}
function segs(attr,key,fn,parse){document.querySelectorAll('['+attr+']').forEach(function(b){b.addEventListener('click',function(){var v=b.getAttribute(attr);st[key]=parse?parse(v):v;document.querySelectorAll('['+attr+']').forEach(function(x){x.classList.toggle('on',x===b);});fn();});});}
function wire(){
  document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.tab);});});
  segs('data-ov-metric','ov',drawOvAnnual);
  segs('data-m-metric','m',renderMonthly);segs('data-m-range','mRange',renderMonthly);
  segs('data-q-metric','q',renderQuarterly);segs('data-q-range','qRange',renderQuarterly);
  segs('data-p-metric','p',renderOutlook);segs('data-p-win','win',function(){renderOutlook();built.overview=false;},Number);
  $('pLong').addEventListener('input',function(e){st.longRun=+e.target.value/100;renderOutlook();built.overview=false;});
  $('pCap').addEventListener('input',function(e){st.cap=+e.target.value/100;renderOutlook();built.overview=false;});
  $('qSel').addEventListener('change',function(e){st.qSel=e.target.value;drawChannels();});
  var rebuild=function(){chartDefaults();built={};RENDER[current]();built[current]=true;};
  if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rebuild);
  new MutationObserver(rebuild).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  wireUpload();
}
function boot(){
  $('app').innerHTML=document.getElementById('shell-src').textContent;
  if(typeof Chart==='undefined'){$('app').insertAdjacentHTML('afterbegin','<div class="preview-bar">The charting library did not load. Check the connection and reload.</div>');return;}
  chartDefaults();X=derive(D);renderHeader();wire();addExportControls();
  var start='overview';try{var s=localStorage.getItem('raast-tab');if(s&&RENDER[s])start=s;}catch(e){}
  if(/^#(overview|monthly|quarterly|ecosystem|outlook|data)$/.test(location.hash))start=location.hash.slice(1);
  show(start);initCapabilities();
}
boot();
})();
</script>
