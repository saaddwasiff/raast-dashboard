name: Update dashboard

# Rebuilds index.html from files in data/inbox. Runs when:
#  - files are uploaded to data/inbox
#  - on the 1st and 16th of each month, after checking SBP's website for a new Payment Systems Review
#  - on demand (Actions tab -> Update dashboard -> Run workflow)
# Vercel publishes the site automatically whenever index.html changes on main.
on:
  push:
    branches: [main]
    paths: ['data/inbox/**']
  schedule:
    - cron: '0 5 1,16 * *'   # 10:00 Pakistan time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Look for a new Payment Systems Review on SBP's website
        if: github.event_name != 'push'
        run: node build/fetch-psr.js

      - name: Check for new files
        id: inbox
        run: |
          if ls data/inbox/*.xlsx data/inbox/*.xls data/inbox/*.pdf data/inbox/*.XLSX data/inbox/*.PDF >/dev/null 2>&1; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read files and rebuild index.html
        if: steps.inbox.outputs.new == 'true'
        run: |
          cd build && npm install --no-audit --no-fund --silent && cd ..
          node build/update.js
          cat data/last-update.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the updated dashboard
        if: steps.inbox.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html data
          git commit -m "Dashboard data updated from uploaded files" || echo "No changes"
          git push

      - name: Report a failed read
        if: failure()
        run: cat data/last-update.md >> "$GITHUB_STEP_SUMMARY" || true
